[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zipper-algebra"
version = "0.1.0.dev0"
description = "Exact presentation and certificate tools for zipper algebra research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
inference = ["sympy>=1.12"]
dev = ["build>=1.2", "pytest>=9,<10", "pytest-timeout>=2.4,<3", "coverage>=7.17,<8"]

[project.scripts]
zipper-algebra = "zipper_algebra.cli:main"

[project.urls]
Repository = "https://github.com/Choomno/zipper-algebra"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["zipper_algebra", "zipper_algebra.*"]
namespaces = false

[tool.setuptools.package-data]
zipper_algebra = ["_build_provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
timeout = 60
timeout_method = "signal"
