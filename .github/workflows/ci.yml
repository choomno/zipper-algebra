name: Tests and distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Inspect and install the wheel
        run: |
          python ci/check_distribution.py dist
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', glob.glob('dist/*.whl')[0]])"
      - name: Test maintained operations and regressions
        run: python -m unittest discover -s tests -v
      - name: Compare historical proof expansion
        run: python -m unittest tools.cofactor.tests_proof_skeleton -v
      - name: Test the installed package outside the checkout
        run: python ci/check_installed.py
      - name: Check source distribution reproduction
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python ci/check_sdist.py dist

  optional-inference:
    name: Coverage and optional factorization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[inference]' coverage==7.17.0
      - run: python ci/check_optional_inference.py
      - name: Measure maintained package coverage including subprocesses
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage run -m unittest tools.cofactor.tests_proof_skeleton -v
          python -m coverage combine
          python -m coverage json -o coverage.json
          python ci/check_coverage.py coverage.json

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python ci/check_docs.py
      - run: python ci/check_x3_manifest.py
      - name: Install the mathematical documentation compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-recommended
      - name: Compile the mathematical specification
        shell: bash
        run: |
          python ci/build_docs.py --output "$RUNNER_TEMP/math-specification/mathematical-specification.pdf"
      - name: Retain the compiled mathematical reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mathematical-specification
          path: ${{ runner.temp }}/math-specification/mathematical-specification.pdf
          if-no-files-found: error
          retention-days: 14
