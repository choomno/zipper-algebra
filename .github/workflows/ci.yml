name: Tests and distributions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install native zipper build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y build-essential libboost-dev libssl-dev
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Inspect and install the wheel
        run: |
          python ci/check_distribution.py dist
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0] + '[dev]'])"
      - name: Build the installed native zipper engine
        run: python -c "from zipper_algebra.zipping_algorithm.native import build_engine; print(build_engine()[0])"
      - name: Test maintained operations and regressions
        run: python -m pytest tests --durations=15
      - name: Test the installed package outside the checkout
        run: python ci/check_installed.py
      - name: Check source distribution reproduction
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python ci/check_sdist.py dist

  optional-inference:
    name: Static analysis, coverage and optional factorization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install native zipper build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y build-essential libboost-dev libssl-dev
      - run: python -m pip install -e '.[inference,symbolic,dev]' coverage==7.17.0
      - name: Build the native zipper engine before measured tests
        run: python -c "from zipper_algebra.zipping_algorithm.native import build_engine; print(build_engine()[0])"
      - name: Lint package, tests and research recipes
        run: python -m ruff check src tests experiments examples ci setup.py
      - name: Type-check the maintained package
        run: python -m mypy
      - run: python ci/check_optional_inference.py
      - name: Measure maintained package coverage including subprocesses
        run: |
          python -m coverage run -m pytest tests --durations=15
          python -m coverage combine
          python -m coverage json -o coverage.json
          python ci/check_coverage.py coverage.json
      - name: Retain the measured coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintained-coverage
          path: coverage.json
          if-no-files-found: warn
          retention-days: 14

  solver-integration:
    name: Native solver and certified reconstruction integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FINITEFLOW_REVISION: a2a5abb9bf90d15416116c0a36a8821e04cbdb7b
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the native solver build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake libboost-all-dev libflint-dev libgmp-dev libsqlite3-dev
      # Original solver: https://gitlab.sai.jku.at/f4ncgb/f4ncgb,
      # by Maximilian Heisinger and Clemens Hofstadler. The GitHub copy pins
      # upstream v1.1.3, the parser correction and optional SQLite I/O.
      - name: Check out the pinned solver with optional SQLite I/O
        shell: bash
        run: |
          git init "$RUNNER_TEMP/f4ncgb-source"
          git -C "$RUNNER_TEMP/f4ncgb-source" remote add origin https://github.com/choomno/f4ncgb.git
          git -C "$RUNNER_TEMP/f4ncgb-source" fetch --depth=1 origin cb37d6570a42cf2f786cc96180b18456ae6d1bcf
          git -C "$RUNNER_TEMP/f4ncgb-source" checkout --detach FETCH_HEAD
      - name: Build the pinned solver
        shell: bash
        run: |
          cmake -S "$RUNNER_TEMP/f4ncgb-source" -B "$RUNNER_TEMP/f4ncgb-source/build" \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_NATIVE=OFF -DENABLE_TEST=OFF -DENABLE_SQLITE=ON
          cmake --build "$RUNNER_TEMP/f4ncgb-source/build" --parallel 2
          "$RUNNER_TEMP/f4ncgb-source/build/f4ncgb" --version
      # Original reconstruction framework: https://github.com/peraro/finiteflow,
      # by Tiziano Peraro. The fork supplies strict source-system validation.
      - name: Fetch the pinned reconstruction engine
        run: |
          git init "$RUNNER_TEMP/finiteflow-source"
          git -C "$RUNNER_TEMP/finiteflow-source" remote add origin https://github.com/Choomno/finiteflow.git
          git -C "$RUNNER_TEMP/finiteflow-source" fetch --depth 1 origin "$FINITEFLOW_REVISION"
          git -C "$RUNNER_TEMP/finiteflow-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/finiteflow-source" rev-parse HEAD)" = "$FINITEFLOW_REVISION"
      - name: Build and install the reconstruction bindings
        run: |
          python -m pip install cffi==2.1.1 'pytest>=9,<10' 'pytest-timeout>=2.4,<3'
          cmake -S "$RUNNER_TEMP/finiteflow-source" -B "$RUNNER_TEMP/finiteflow-build" \
            -DCMAKE_BUILD_TYPE=Release -DFFLOW_MATHEMATICA=OFF -DFFLOW_PYTHON=ON \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/finiteflow-install" \
            -DFFLOW_PYTHON_INSTALL="$(python -c 'import sysconfig; print(sysconfig.get_paths()["platlib"])')"
          cmake --build "$RUNNER_TEMP/finiteflow-build" --parallel 2
          cmake --install "$RUNNER_TEMP/finiteflow-build"
      - name: Install the fresh wheel and symbolic dependency
        run: |
          python -m pip install build
          python -m build --wheel
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0] + '[symbolic]'])"
      - name: Check small installed native matrix reconstructions
        run: |
          cd "$RUNNER_TEMP"
          python -I -c 'import fflow; assert fflow.__fork__ == "choomno/finiteflow"; assert hasattr(fflow, "LSolveValidateFullSystem")'
          python -I -m pytest "$GITHUB_WORKSPACE/tests/integration/test_finiteflow.py" "$GITHUB_WORKSPACE/tests/integration/test_minimal_polynomial_native.py" "$GITHUB_WORKSPACE/tests/integration/test_generic_production_native.py" "$GITHUB_WORKSPACE/tests/integration/test_cofactor_reconstruction_native.py" "$GITHUB_WORKSPACE/tests/integration/test_cofactor_backend_native.py" --import-mode=importlib -q
          F4NCGB_BINARY="$RUNNER_TEMP/f4ncgb-source/build/f4ncgb" python -I -m pytest "$GITHUB_WORKSPACE/tests/integration/test_general_solver_native.py" --import-mode=importlib -q
      - name: Check native execution and certificate reconstruction
        shell: bash
        run: |
          python ci/check_solver.py --binary "$RUNNER_TEMP/f4ncgb-source/build/f4ncgb" \
            --revision cb37d6570a42cf2f786cc96180b18456ae6d1bcf \
            --solver-io files --output "$RUNNER_TEMP/solver-integration/files"
          python ci/check_solver.py --binary "$RUNNER_TEMP/f4ncgb-source/build/f4ncgb" \
            --revision cb37d6570a42cf2f786cc96180b18456ae6d1bcf \
            --solver-io sqlite --output "$RUNNER_TEMP/solver-integration/sqlite"
      - name: Retain the fresh computation and verification records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-solver-computation
          path: ${{ runner.temp }}/solver-integration
          if-no-files-found: warn
          retention-days: 14

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python ci/check_docs.py
      - run: python ci/check_x3_manifest.py
      - run: python ci/build_x3_manifest.py --check
      - name: Install the mathematical documentation compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-recommended
      - name: Compile the mathematical specification
        shell: bash
        run: |
          python ci/build_docs.py --output "$RUNNER_TEMP/math-specification/mathematical-specification.pdf"
      - name: Retain the compiled mathematical reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mathematical-specification
          path: ${{ runner.temp }}/math-specification/mathematical-specification.pdf
          if-no-files-found: error
          retention-days: 14
